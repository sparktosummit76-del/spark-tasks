# pages.yml – run the tests, then publish src/ to GitHub Pages (Day 5 preview deployment)
name: Test and deploy preview

# Run on every push to main, and when started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4          # download the repository

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The release gate: if any test fails, the job stops here
      # and nothing is published.
      - name: Run tests (release gate)
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./src                      # publish only the app folder
      - id: deployment
        uses: actions/deploy-pages@v4
